<meta charset="utf-8">

<title>英语 · 生词本</title>
<style>
:root{--accent:#C9A7E8;--accent-d:#7A5AA8;--text:#1A1B1C;--sub:#6B7280;--bg:#F4F3EE;--card:#FFFFFF;--border:#E4E3DD;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);padding:16px;line-height:1.6;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:20px;font-weight:700;margin-bottom:2px;}
.back{font-size:12px;color:var(--sub);text-decoration:none;display:inline-block;margin-bottom:6px;}
.sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.stat{flex:1 1 130px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;}
.stat .n{font-size:18px;font-weight:700;color:var(--accent-d);}
.stat .l{font-size:11px;color:var(--sub);}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.toolbar input[type=text]{flex:1 1 200px;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);}
.toolbar select,.toolbar button{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;}
.toolbar button.on{background:var(--accent);border-color:var(--accent);font-weight:600;}
.toolbar button.danger{background:rgba(234,102,104,0.12);border-color:#EA6668;color:#B44244;}
.toolbar a.go{font-size:13px;padding:7px 12px;border-radius:8px;background:var(--accent-d);color:#fff;text-decoration:none;font-weight:600;}
.wl{list-style:none;}
.wl li{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;background:var(--card);font-size:13.5px;}
.wl li .wd{font-weight:700;min-width:150px;flex:1 1 150px;}
.wl li .ph{font-size:12px;color:var(--sub);min-width:130px;flex:0 1 130px;}
.wl li .ps{font-size:12px;color:var(--accent-d);min-width:38px;}
.wl li .mn{flex:3 1 240px;color:var(--text);}
.wl li .meta{font-size:11px;color:var(--sub);flex:0 0 auto;text-align:right;}
.wl li .rm{font-size:12px;cursor:pointer;border:1px solid var(--border);border-radius:6px;background:#fff;color:#B44244;padding:3px 8px;flex:0 0 auto;}
.wl li .src{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,0.05);color:var(--sub);}
.tag-src{font-size:10px;padding:1px 8px;border-radius:8px;margin-left:4px;flex:0 0 auto;font-weight:600;}
.tag-通用{background:rgba(82,196,26,0.14);color:#3E8C13;border:1px solid #52C41A;}
.tag-四级{background:rgba(250,173,20,0.18);color:#8A5B00;border:1px solid #FAAD14;}
.tag-专升本{background:rgba(201,167,232,0.24);color:var(--accent-d);border:1px solid var(--accent);}
.fcard .ftag{font-size:12px;margin-bottom:8px;display:inline-block;}
.flip{display:none;}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 22px;text-align:center;margin-bottom:12px;min-height:180px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
.fcard .fw{font-size:34px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;}
.fcard .fph{font-size:16px;color:var(--sub);margin-bottom:10px;}
.fcard .fback{display:none;font-size:18px;line-height:1.7;}
.fcard .fback .ps{color:var(--accent-d);font-weight:600;margin-right:6px;}
.fctrl{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.fctrl button{font-size:14px;padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;}
.fctrl button.known{background:rgba(82,196,26,0.14);border-color:#52C41A;color:#3E8C13;}
.fctrl button.unk{background:rgba(234,102,104,0.12);border-color:#EA6668;color:#B44244;}
.fprog{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:30px 0;}
.dlbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.dlbar button{font-size:13px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;}
.dlbar button.g{background:rgba(82,196,26,0.14);border-color:#52C41A;color:#3E8C13;font-weight:600;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1A1B1C;color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;}
/* 移动端适配 */
@media (max-width:480px){
  .toolbar select,.toolbar button,.toolbar a{min-height:44px;font-size:14px;}
  .toolbar input{min-height:44px;font-size:14px;}
  .wl li{flex-wrap:wrap;gap:6px;padding:10px;}
  .wl li .wd{min-width:0;flex:1 1 120px;}
  .wl li .ph{min-width:0;flex:0 1 auto;}
  .wl li .ps{min-width:0;}
  .wl li .mn{flex:1 1 100%;min-width:0;word-break:break-word;font-size:13px;}
  .wl li .rm{min-height:36px;}
  .dlbar button{min-height:44px;font-size:14px;}
}
</style>
</head>

</div>

(function(){
  var WORDS = window.__WORDS__ || [];
  var MANUAL = window.__MANUAL__ || [];
  var KEY_S = "yingyu_shengci_v1";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
  function tagHtml(tag){
    if(!tag) return '';
    return '<span class="tag-src tag-'+esc(tag)+'">'+esc(tag)+'</span>';
  }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1400); }
  function load(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } }
  function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

  var shengci = load(KEY_S);
  var idx = {};
  WORDS.forEach(function(w){ idx[String(w[0]).toLowerCase()] = {word:w[0], phon:w[1], pos:w[2], mean:w[3], src:"web", tag:w[4]||""}; });

  // 生词列表合并：web（localStorage）+ manual（W-格式）
  function buildList(){
    var list = [];
    Object.keys(shengci).forEach(function(k){
      var base = idx[k] || {word:k, phon:"", pos:"", mean:"", src:"web"};
      list.push({word:base.word, phon:base.phon, pos:base.pos, mean:base.mean, src:"web", tag:base.tag, t:shengci[k].t||"", status:shengci[k].s||""});
    });
    MANUAL.forEach(function(m){
      var w = m["单词"]||"";
      if(!w) return;
      list.push({word:w, phon:m["音标"]||"", pos:m["词性"]||"", mean:m["释义"]||"", src:"manual", tag:"", t:"", status:m["状态"]||"待复习"});
    });
    // 去重（manual 优先）
    var seen={}, out=[];
    list.forEach(function(it){ var k=String(it.word).toLowerCase(); if(seen[k]) return; seen[k]=1; out.push(it); });
    return out;
  }
  function render(){
    var q = ($("search").value||"").trim().toLowerCase();
    var list = buildList();
    $("stTotal").textContent = list.length;
    $("stWeb").textContent = Object.keys(shengci).length;
    $("stManual").textContent = MANUAL.length;
    var box=$("listBox"); box.innerHTML="";
    var html='<ul class="wl">', count=0;
    list.forEach(function(it){
      if(q && !(String(it.word).toLowerCase().indexOf(q)>=0 || String(it.mean).toLowerCase().indexOf(q)>=0)) return;
      count++;
      html+='<li><span class="wd">'+esc(it.word)+'</span>'
        +'<span class="ph">'+(it.phon?esc(it.phon):"")+'</span>'
        +'<span class="ps">'+(it.pos?esc(it.pos):"")+'</span>'
        +'<span class="mn">'+esc(it.mean)+'</span>'
        +tagHtml(it.tag)
        +'<span class="src">'+(it.src==="manual"?"手写":"标星")+'</span>'
        +'<span class="meta">'+(it.t?esc(it.t):"")+'</span>'
        +'<button class="rm" data-w="'+esc(it.word)+'">移除</button></li>';
    });
    html+='</ul>';
    if(!count) html='<div class="empty">还没有生词。<br>去《单词本》给单词标星，或手动往《生词本.md》加词。</div>';
    box.innerHTML=html;
    box.querySelectorAll(".rm").forEach(function(b){ b.onclick=function(){ removeOne(b.getAttribute("data-w")); }; });
    return list;
  }
  function removeOne(word){
    var key=String(word).toLowerCase();
    if(shengci[key]){ delete shengci[key]; save(KEY_S, shengci); toast("已移除："+word); }
    else toast("该词为手动记录，请直接编辑《生词本.md》");
    if(mode==="list") render();
  }
  // 翻卡
  var mode="list", flips=[], fi=0, flipped=false;
  function renderFlip(){
    flips = buildList();
    if(!flips.length){ $("flipBox").style.display="block"; $("fWord").textContent="没有生词"; $("fPhon").textContent=""; $("ftag").innerHTML=""; $("fBack").textContent=""; $("fctrl").style.display="none"; $("fprog").textContent=""; return; }
    fi=0; flipped=false; showFlip();
  }
  function showFlip(){
    var it=flips[fi]; if(!it) return;
    $("fWord").textContent=it.word;
    $("fPhon").textContent=it.phon||"";
    $("ftag").innerHTML=tagHtml(it.tag);
    $("fBack").innerHTML='<span class="ps">'+(it.pos?esc(it.pos)+".":"")+'</span>'+esc(it.mean);
    $("fBack").style.display="none";
    $("fctrl").style.display="flex";
    $("fprog").textContent=(fi+1)+" / "+flips.length;
  }
  function next(){ fi++; if(fi>=flips.length){ $("fctrl").style.display="none"; $("fWord").textContent="本轮复习完！"; $("fPhon").textContent=""; $("ftag").innerHTML=""; $("fBack").style.display="none"; $("fprog").textContent="共 "+flips.length+" 个生词"; return; } flipped=false; showFlip(); }
  function setMode(m){
    mode=m;
    $("modeList").className=m==="list"?"on":"";
    $("modeFlip").className=m==="flip"?"on":"";
    $("listBox").style.display=m==="list"?"block":"none";
    $("flipBox").style.display=m==="flip"?"block":"none";
    if(m==="flip") renderFlip();
  }
  $("search").addEventListener("input", function(){ if(mode==="list") render(); });
  $("modeList").onclick=function(){ setMode("list"); };
  $("modeFlip").onclick=function(){ setMode("flip"); };
  $("fcard").onclick=function(){ if(fi>=flips.length)return; flipped=!flipped; $("fBack").style.display=flipped?"block":"none"; };
  $("bKnown").onclick=next;
  $("bNo").onclick=next;
  $("btnClear").onclick=function(){
    Object.keys(shengci).forEach(function(k){ if(shengci[k].s==="已掌握"||shengci[k].s==="认识") delete shengci[k]; });
    save(KEY_S, shengci); toast("已移除标记为已掌握的网页生词"); render();
  };
  $("btnClearAll").onclick=function(){
    shengci={}; save(KEY_S,shengci); toast("已清空网页标星的生词（手动记录不受影响）"); render();
  };
  // 导出
  function toW(text){
    var out="# 英语 · 生词本\n\n> 由《生词本.html》导出 / 手动维护。格式：每个生词用 `## W-序号` 开头。\n\n---\n\n";
    var i=0;
    text.forEach(function(it){
      i++;
      out+="## W-"+String(i).padStart(3,"0")+"\n";
      out+="- 单词："+it.word+"\n";
      if(it.phon) out+="- 音标："+it.phon+"\n";
      if(it.pos) out+="- 词性："+it.pos+".\n";
      out+="- 释义："+it.mean+"\n";
      out+="- 状态：待复习\n";
      out+="\n";
    });
    return out;
  }
  function downloadMd(text){
    var blob=new Blob(["\ufeff"+text], {type:"text/markdown;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="生词本.md"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  }
  $("btnExport").onclick=function(){
    var list=buildList();
    if(!list.length){ toast("还没有生词可导出"); return; }
    downloadMd(toW(list)); toast("已导出《生词本.md》，请保存到 D:\\专升本学习\\英语\\错题集\\");
  };
  $("btnCopy").onclick=function(){
    var list=buildList();
    if(!list.length){ toast("还没有生词"); return; }
    var text=toW(list);
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast("已复制 W- 格式"); },function(){ promptCopy(text); }); }
    else promptCopy(text);
  };
  function promptCopy(text){ var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); toast("已复制 W- 格式"); }
  render();
})();
</script>

<div id="aiFab" title="AI 学习助手">🤖</div>
<div id="aiPanel" style="display:none;">
  <div id="aiHead"><span>AI 学习助手</span><button id="aiClose" aria-label="关闭">×</button></div>
  <div id="aiMsgs"></div>
  <div id="aiInputRow">
    <input id="aiInput" placeholder="问学习问题，或点题目的「AI讲题」…" maxlength="2000">
    <button id="aiSend">发送</button>
  </div>
</div>
<style>
#aiFab{position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#4F7CF7,#6A5AF9);color:#fff;font-size:24px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;
  box-shadow:0 4px 14px rgba(79,124,247,.4);-webkit-tap-highlight-color:transparent;user-select:none;}
#aiPanel{position:fixed;right:16px;bottom:80px;width:min(360px,calc(100vw - 32px));height:min(480px,calc(100vh - 120px));
  background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:9999;
  display:flex;flex-direction:column;overflow:hidden;border:1px solid #E4E3DD;}
#aiHead{background:linear-gradient(135deg,#4F7CF7,#6A5AF9);color:#fff;padding:10px 14px;
  font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
#aiClose{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;
  border-radius:50%;font-size:16px;line-height:1;cursor:pointer;}
#aiMsgs{flex:1;overflow-y:auto;padding:12px;background:#FAF9F6;display:flex;flex-direction:column;gap:8px;font-size:14px;}
.ai-msg{max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.55;}
.ai-user{align-self:flex-end;background:#4F7CF7;color:#fff;border-bottom-right-radius:4px;}
.ai-bot{align-self:flex-start;background:#fff;border:1px solid #E4E3DD;border-bottom-left-radius:4px;color:#1A1B1C;}
.ai-bot.err{color:#B44244;background:#FDF0EF;}
.ai-typing{color:#6B7280;font-style:italic;}
.ai-msg .ai-math{display:inline-block;margin:2px 2px;}
.ai-msg .ai-math-plain{font-family:Consolas,Monaco,monospace;font-size:0.92em;background:rgba(79,124,247,0.07);border-radius:4px;padding:0 4px;}
.ai-msg strong{font-weight:700;}
#aiInputRow{display:flex;gap:8px;padding:10px;border-top:1px solid #E4E3DD;background:#fff;}
#aiInput{flex:1;border:1px solid #D8D6CF;border-radius:10px;padding:8px 11px;font-size:14px;outline:none;min-width:0;}
#aiInput:focus{border-color:#4F7CF7;}
#aiSend{background:#4F7CF7;color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:14px;cursor:pointer;font-weight:600;}
@media (max-width:480px){#aiPanel{right:8px;bottom:76px;width:calc(100vw - 16px);}}
</style>
<script>
(function(){
  var API="https://ai.scgsstudy.top";
  var fab=document.getElementById("aiFab");
  var panel=document.getElementById("aiPanel");
  var msgs=document.getElementById("aiMsgs");
  var input=document.getElementById("aiInput");
  var send=document.getElementById("aiSend");
  var close=document.getElementById("aiClose");
  if(!fab||!panel) return;
  var open=false;
  function toggle(force){
    open=(typeof force==="boolean")?force:!open;
    panel.style.display=open?"flex":"none";
    if(open&&input) input.focus();
  }
  fab.addEventListener("click",function(){ toggle(); });
  if(close) close.addEventListener("click",function(){ toggle(false); });
  function escAI(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function plainMath(x){
    return String(x)
      .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,function(_,a,b){ return "("+a+"/"+b+")"; })
      .replace(/\\sqrt(\[[^{}\]]*\])?\{([^{}]+)\}/g,function(_,r,b){ return r?"("+b+")^(1/"+String(r).replace(/[\[\]]/g,"")+")":"√("+b+")"; })
      .replace(/\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g,function(_,a,b){ return "("+a+"/"+b+")"; })
      .replace(/\\lim_?\{?([^{}]*)\}?/g,"lim→$1")
      .replace(/\\infty/g,"∞").replace(/\\to/g,"→").replace(/\\rightarrow/g,"→")
      .replace(/\\cdot/g,"·").replace(/\\times/g,"×").replace(/\\pm/g,"±")
      .replace(/\\le/g,"≤").replace(/\\ge/g,"≥").replace(/\\ne/g,"≠").replace(/\\approx/g,"≈")
      .replace(/\\left/g,"").replace(/\\right/g,"")
      .replace(/\\big|\\Big/g,"").replace(/\\([a-zA-Z]+)/g,"$1")
      .replace(/\\,/g," ").replace(/\\ /g," ")
      .replace(/[{}]/g,"");
  }
  function renderAI(text){
    if(!text) return "";
    var t=escAI(text);
    // 代码块先保护
    var codes=[];
    t=t.replace(/`([^`]*)`/g,function(_,c){ codes.push(c); return "\u0000C"+(codes.length-1)+"\u0000"; });
    function fmt(x,display){
      try{
        if(typeof katex!=="undefined"&&katex.renderToString){
          return '<span class="ai-math">'+katex.renderToString(x,{displayMode:display,throwOnError:false})+'</span>';
        }
      }catch(e){}
      return '<span class="ai-math-plain">'+plainMath(x)+'</span>';
    }
    t=t.replace(/\$\$([\s\S]+?)\$\$/g,function(_,x){ return fmt(x,true); });
    t=t.replace(/\\\[([\s\S]+?)\\\]/g,function(_,x){ return fmt(x,true); });
    t=t.replace(/\$([^$\n]+?)\$/g,function(_,x){ return fmt(x,false); });
    t=t.replace(/\\\(([^\\]+?)\\\)/g,function(_,x){ return fmt(x,false); });
    t=t.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
    t=t.replace(/\u0000C(\d+)\u0000/g,function(_,i){
      return '<code style="background:rgba(0,0,0,0.06);border-radius:4px;padding:1px 5px;font-family:Consolas,Monaco,monospace;font-size:0.9em;color:#B44244;white-space:pre-wrap;word-break:break-all;">'+escAI(codes[+i]||"")+'</code>';
    });
    return t;
  }
  function append(role,text,cls){
    var d=document.createElement("div");
    d.className="ai-msg "+(role==="user"?"ai-user":"ai-bot")+(cls?" "+cls:"");
    if(role==="bot"&&!cls){ d.innerHTML=renderAI(text); }
    else{ d.textContent=text; }
    if(msgs) msgs.appendChild(d);
    if(msgs) msgs.scrollTop=msgs.scrollHeight;
    return d;
  }
  function ask(q,title){
    if(!q||!q.trim()) return;
    toggle(true);
    var finalQ=title?("【"+title+"】\n"+q):q;
    append("user",finalQ);
    var typing=append("bot","思考中…","ai-typing");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:[
        {role:"system",content:"你是四川专升本学习助手，回答要清晰分点、面向专升本考生。数学公式请用LaTeX：行内用 $...$，独立公式用 $$...$$。"},
        {role:"user",content:finalQ}
      ],max_tokens:700})})
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error("服务返回 "+r.status+(t.length<150?": "+t:"")); });
        return r.json();
      })
      .then(function(j){
        var c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"(空回复)";
        typing.className="ai-msg ai-bot";
        typing.innerHTML=renderAI(c);
      })
      .catch(function(e){
        typing.className="ai-msg ai-bot err";
        typing.textContent="请求失败："+e.message;
      });
  }
  if(send) send.addEventListener("click",function(){ var v=input.value; if(v.trim()){ input.value=""; ask(v); } });
  if(input) input.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); var v=input.value; if(v.trim()){ input.value=""; ask(v); } } });
  window.AIAsk=ask;
})();
</script>

</body>
