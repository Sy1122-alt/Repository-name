        <script>
            var audios = document.getElementsByTagName('audio');
            console.log(audios)
            
            for(var i=0; i<audios.length; i++) {
                var audio = audios[i];
                var audioWrapper = audio.parentNode;
                var btn = audioWrapper.getElementsByClassName('button')[0];
                
                // 播放完毕
                audio.addEventListener('ended', function() {
                                       console.log("音频已播放完成");
                                       btn.style.background = 'url(play.png) no-repeat center';
                                       btn.style.backgroundSize = '20px';
                                       },false);
                                       
                                       // 点击按钮
                                       btn.addEventListener('click',function(event){
                                                            console.log('clicked')
                                                            var audioWrapper = this.parentNode;
                                                            var audio = audioWrapper.getElementsByClassName('audio')[0];
                                                            event.stopPropagation();//防止冒泡
                                                            if(audio.paused){ //如果当前是暂停状态
                                                            // 暂停其他正在播放的音频
                                                            for (var i=0; i<audios.length; i++) {
                                                            if (!audios[i].paused) {
                                                            console.log(audios[i])
                                                            audios[i].parentNode.getElementsByClassName('button')[0].style.backgroundImage = 'url(play.png)';
                                                            audios[i].pause();
                                                            }
                                                            }
                                                            this.style.backgroundImage = 'url(https://atpub.oss-cn-beijing.aliyuncs.com/static/pause.png)';
                                                            audio.play(); //播放
                                                            
                                                            return;
                                                            }else{//当前是播放状态
                                                            this.style.backgroundImage = 'url(https://atpub.oss-cn-beijing.aliyuncs.com/static/play.png)';
                                                            audio.pause(); //暂停
                                                            return;
                                                            }
                                                            });
                                                            
                                                            // 监听音频播放时间并更新进度条
                                                            audio.addEventListener('timeupdate', function () {
                                                                                   updateProgress(this);
                                                                                   });
                                                                                   
                                                                                   // 鼠标拖动进度点时可以调节进度
                                                                                   // 只有音乐开始播放后才可以调节，已经播放过但暂停了的也可以
                                                                                   // 鼠标按下时
                                                                                   var dot = audioWrapper.getElementsByClassName('dot')[0];
                                                                                   dot.addEventListener('touchstart', function(evnet) {
                                                                                                        var audioWrapper = this.parentNode.parentNode.parentNode;
                                                                                                        var audio = audioWrapper.getElementsByClassName('audio')[0];
                                                                                                        var bar = audioWrapper.getElementsByClassName('bar')[0];
                                                                                                        var progress = audioWrapper.getElementsByClassName('progress')[0];
                                                                                                        if (!audio.paused || audio.currentTime != 0) {
                                                                                                        var length = bar.offsetWidth;
                                                                                                        var nowProgress = progress.offsetWidth;
                                                                                                        var mouseX = event.touches[0].clientX;
                                                                                                        var maxLeft = nowProgress; // 向左最大可拖动距离
                                                                                                        var maxRight = length - nowProgress; // 向右最大可拖动距离
                                                                                                        
                                                                                                        // 禁止默认的选中事件（避免鼠标拖拽进度点的时候选中文字）
                                                                                                        if (event.preventDefault) {
                                                                                                        event.preventDefault();
                                                                                                        } else {
                                                                                                        event.returnValue = false;
                                                                                                        }
                                                                                                        
                                                                                                        // 禁止事件冒泡
                                                                                                        if (event && event.stopPropagation) {
                                                                                                        event.stopPropagation();
                                                                                                        } else {
                                                                                                        window.event.cancelBubble = true;
                                                                                                        }
                                                                                                        // 开始拖动
                                                                                                        this.addEventListener('touchmove', function(e) {
                                                                                                                              var move = e.touches[0].clientX - mouseX;
                                                                                                                              if (move > maxRight) {
                                                                                                                              move = maxRight;
                                                                                                                              } else if (move < -maxLeft) {
                                                                                                                              move = -maxLeft;
                                                                                                                              }
                                                                                                                              var rate = (nowProgress + move) / length;
                                                                                                                              audio.currentTime = audio.duration * rate;
                                                                                                                              updateProgress(audio);
                                                                                                                              });
                                                                                                        
                                                                                                        }
                                                                                                        });
            }
        
        // 更新进度条与当前播放时间
        function updateProgress(audio) {
            var audioWrapper = audio.parentNode;
            var progress = audioWrapper.getElementsByClassName('progress')[0];
            var time = audioWrapper.getElementsByClassName('time')[0];
            var value = audio.currentTime / audio.duration;
            progress.style.width = value * 100 + '%';
            time.innerHTML = transTime(audio.currentTime);
        }
        // 时间转换
        function transTime(value) {
            var time = "";
            var h = parseInt(value / 3600);
            value %= 3600;
            var m = parseInt(value / 60);
            var s = parseInt(value % 60);
            if (h > 0) {
                time = formatTime(h + ":" + m + ":" + s);
            } else {
                time = formatTime(m + ":" + s);
            }
            return time;
        }
        /**
         * 格式化时间显示，补零对齐
         * eg：2:4  -->  02:04
         * @param {string} value - 形如 h:m:s 的字符串
         */
        function formatTime(value) {
            var time = "";
            var s = value.split(':');
            var i = 0;
            for (; i < s.length - 1; i++) {
                time += s[i].length == 1 ? ("0" + s[i]) : s[i];
                time += ":";
            }
            time += s[i].length == 1 ? ("0" + s[i]) : s[i];
            return time;
        }
        
            </script>
